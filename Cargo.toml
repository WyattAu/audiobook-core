[package]
name = "audiobook-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Audiobook domain model — format-independent titles, parts and chapters assembled from MP3 (id3-core) and MP4 (mp4-core) containers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/audiobook-core"
keywords = ["audiobook", "m4b", "chapters", "podcast", "media", "library"]
categories = ["multimedia::audio", "data-structures"]
exclude = [".github/"]

[dependencies]
# Estate L0 leaves. All three are no_std + alloc with a single thiserror
# dependency, so this crate stays no_std too.
id3-core = { version = "0.1", path = "../id3-core" }
mp4-core = { version = "0.3", path = "../mp4-core" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.layers]
tier = "L1"
